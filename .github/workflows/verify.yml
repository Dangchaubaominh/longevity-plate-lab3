name: Verify Lab3
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run lint && npm run typecheck && npm test && npm run build && npm audit --audit-level=high
        working-directory: admin
      - run: npx playwright install --with-deps chromium
        working-directory: admin
      - run: npm run test:e2e
        working-directory: admin
      - run: npm ci
        working-directory: server
      - run: npm run lint && npm run typecheck && npm run db:migrate && npm run openapi && git diff --exit-code -- ../docs/openapi.json && npm run security && npm test && npm run build && npm audit --audit-level=high
        working-directory: server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: admin/test-results
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
