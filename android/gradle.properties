# Keep builds usable on laptops with 6-8 GB RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Flutter 3.47+ and the current plugins use AGP 9's built-in Kotlin.
android.builtInKotlin=true
# Kotlin incremental caches fail with "different roots" when the project and the Pub cache are on different drives
kotlin.incremental=false
